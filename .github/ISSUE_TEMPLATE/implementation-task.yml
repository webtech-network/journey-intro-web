name: Implementation task
description: Track a focused execution task with clear objective and done criteria.
title: "[Task] "
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What should this task achieve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Proposed implementation approach.

  - type: textarea
    id: done_criteria
    attributes:
      label: Acceptance Criteria
      placeholder: |
        - [ ] Expected outcome 1
        - [ ] Expected outcome 2

  - type: textarea
    id: references
    attributes:
      label: References and dependencies (optional)
      description: Parent issues, related PRs, or linked backend/frontend tasks.
