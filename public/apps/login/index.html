<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIW | Área do Usuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./scripts/login.js"></script>
    <script>
        // Verifica se há sessão ativa; se não, redireciona para o login
        if (!usuarioCorrente.login) {
            window.location.href = LOGIN_URL;
        }
    </script>
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-0">Olá, <span id="nomeUsuario" class="text-primary"></span>!</h1>
            <button id="btn_logout" class="btn btn-outline-danger">Sair</button>
        </div>

        <div class="alert alert-success">
            ✅ Você está autenticado. Seus dados de sessão estão no <code>sessionStorage</code>.
        </div>

        <h2 class="h5 mt-4 mb-3">Usuários cadastrados no sistema</h2>
        <table id="grid-usuarios" class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Nome</th>
                    <th>Login</th>
                    <th>E-mail</th>
                </tr>
            </thead>
            <tbody id="table-usuarios"></tbody>
        </table>

        <div class="card mt-4">
            <div class="card-header"><strong>Dados da sessão atual (sessionStorage)</strong></div>
            <div class="card-body">
                <pre id="session-data" class="mb-0 text-success bg-dark p-3 rounded" style="font-size:0.85rem"></pre>
            </div>
        </div>
    </div>

    <script>
        function exibeUsuarios() {
            const tbody = document.getElementById("table-usuarios");
            tbody.innerHTML = db_usuarios.map(u =>
                `<tr><td>${u.nome}</td><td>${u.login}</td><td>${u.email}</td></tr>`
            ).join('');
        }

        function initPage() {
            document.getElementById('btn_logout').addEventListener('click', logoutUser);
            document.getElementById('nomeUsuario').textContent = usuarioCorrente.nome;

            // Exibe dados da sessão de forma legível
            document.getElementById('session-data').textContent =
                JSON.stringify(usuarioCorrente, null, 2);

            // Aguarda o carregamento dos usuários e exibe
            setTimeout(exibeUsuarios, 500);
        }

        window.addEventListener('load', initPage);
    </script>
</body>
</html>
