<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIW | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    body { background: #1e1b4b; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { background: white; border-radius: 16px; padding: 2rem; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .login-card h2 { color: #1e1b4b; font-weight: 800; }
    .btn-login { background: #4f46e5; border: none; width: 100%; padding: 0.75rem; font-weight: 600; border-radius: 8px; }
    .btn-login:hover { background: #4338ca; }
  </style>
</head>
<body>
  <div class="login-card">
    <h2 class="text-center mb-1">🔐 Login</h2>
    <p class="text-center text-muted small mb-4">Desenvolvimento de Interfaces Web</p>

    <form id="login-form">
      <div class="mb-3">
        <label for="username" class="form-label fw-semibold">Usuário</label>
        <input type="text" name="username" id="username" class="form-control" placeholder="admin" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label fw-semibold">Senha</label>
        <input type="password" name="password" id="password" class="form-control" placeholder="123" required>
      </div>
      <button type="submit" class="btn btn-login text-white">Entrar</button>
    </form>

    <hr class="my-3">
    <div class="text-center">
      <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-toggle="modal" data-bs-target="#modalNovo">
        Criar conta
      </button>
    </div>

    <div class="mt-3 p-2 bg-light rounded small text-muted">
      <strong>Contas de teste:</strong><br>
      login: <code>admin</code> / senha: <code>123</code><br>
      login: <code>user</code> / senha: <code>123</code>
    </div>
  </div>

  <!-- Modal Novo Usuário -->
  <div class="modal fade" id="modalNovo" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Criar Nova Conta</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <label class="form-label">Login</label>
            <input type="text" id="txt_login" class="form-control" placeholder="Escolha um login">
          </div>
          <div class="mb-2">
            <label class="form-label">Nome completo</label>
            <input type="text" id="txt_nome" class="form-control">
          </div>
          <div class="mb-2">
            <label class="form-label">E-mail</label>
            <input type="email" id="txt_email" class="form-control">
          </div>
          <div class="mb-2">
            <label class="form-label">Senha</label>
            <input type="password" id="txt_senha" class="form-control">
          </div>
          <div class="mb-2">
            <label class="form-label">Confirmar Senha</label>
            <input type="password" id="txt_senha2" class="form-control">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" id="btn_salvar" class="btn btn-primary">Cadastrar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./scripts/login.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const login = document.getElementById('username').value;
      const senha = document.getElementById('password').value;
      if (loginUser(login, senha)) {
        window.location.href = 'index.html';
      } else {
        alert('Usuário ou senha incorretos. Tente: admin / 123');
      }
    });

    document.getElementById('btn_salvar').addEventListener('click', function() {
      const login  = document.getElementById('txt_login').value;
      const nome   = document.getElementById('txt_nome').value;
      const email  = document.getElementById('txt_email').value;
      const senha  = document.getElementById('txt_senha').value;
      const senha2 = document.getElementById('txt_senha2').value;
      if (senha !== senha2) { alert('As senhas não conferem.'); return; }
      if (!login || !nome || !senha) { alert('Preencha todos os campos.'); return; }
      addUser(nome, login, senha, email);
      bootstrap.Modal.getInstance(document.getElementById('modalNovo')).hide();
    });
  </script>
</body>
</html>
